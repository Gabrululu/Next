[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
# The Foundry test reads the shared Solidity/TypeScript test vector.
fs_permissions = [{ access = "read", path = "../scripts" }]

[fuzz]
runs = 256

[rpc_endpoints]
monad_testnet = "${RPC_URL}"
